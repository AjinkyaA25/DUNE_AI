<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dune AI Table</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top">
  <div class="brand">Dune AI Table</div>
  <div class="status" id="status">No game</div>
  <div class="top-actions">
    <label class="toggle" title="Show the AI players' hands and intrigues (practice / review mode)">
      <input type="checkbox" id="reveal"> Show AI hands
    </label>
    <label class="toggle" title="Show the position evaluator: each player's chance to win, and how each of your moves changes yours">
      <input type="checkbox" id="evalOn"> Evaluation
    </label>
    <button id="newBtn" class="btn">New game</button>
  </div>
</header>

<main class="layout">
  <section class="left">
    <div class="panel board" id="board"></div>
    <div class="bottom">
      <div class="panel hand">
        <div class="panel-title">Your hand <span class="muted" id="handHint"></span></div>
        <div class="cards" id="hand"></div>
        <div class="panel-title small">Intrigue</div>
        <div class="chips" id="intrigues"></div>
        <div class="panel-title small">In play this round</div>
        <div class="cards small" id="inplay"></div>
      </div>
      <div class="panel row">
        <div class="panel-title">Imperium Row <span class="muted" id="persuasion"></span></div>
        <div class="cards" id="row"></div>
        <div class="chips" id="reserve"></div>
      </div>
    </div>
    <div class="panel contracts" id="contracts"></div>
    <div class="panel players" id="players"></div>
    <div class="panel purchases" id="purchases"></div>
  </section>

  <section class="right">
    <div class="panel evalp" id="evalp" hidden></div>
    <div class="panel turn" id="turn"></div>
    <div class="panel log">
      <div class="panel-title">Moves <span class="muted">(click an AI move to see what it considered)</span></div>
      <div id="log"></div>
    </div>
  </section>

</main>

<div class="zoom" id="zoom"></div>

<dialog id="pileDlg" class="pile-dlg">
  <div class="pile-hd"><span id="pileTitle"></span><button class="btn ghost pile-close">Close</button></div>
  <div class="pile-body" id="pileBody"></div>
</dialog>

<dialog id="newDlg">
  <form method="dialog" id="newForm">
    <h2>New game</h2>
    <p class="muted">4 players. The AI was trained and benchmarked with Bloodlines on.</p>
    <label>Your seat
      <select id="seat">
        <option value="0">Red: first player in round 1</option>
        <option value="1">Green</option>
        <option value="2">Yellow</option>
        <option value="3">Blue</option>
        <option value="-1">Watch: AI vs AI (no human seat)</option>
        <option value="-2">Replay a recorded self-play game</option>
      </select>
    </label>
    <label id="paceRow" hidden>Seconds per move <input id="pace" value="1" inputmode="decimal"></label>
    <label id="replayRow" hidden>Recorded self-play game
      <select id="replayPick"><option value="">loading…</option></select>
    </label>
    <label class="inline"><input type="checkbox" id="useLeaders" checked> Play with Leaders (AIs get random Leaders)</label>
    <div id="leaderRow">
      <div class="leader-row-title">Your Leader <span class="muted" id="leaderPicked">Random</span></div>
      <select id="leaderPick" hidden><option value="">Random</option></select>
      <div id="leaderGrid" class="leader-grid" role="listbox" aria-label="Your Leader"></div>
    </div>
    <div id="leaderPreview" class="leader-preview"></div>
    <div id="oppRows"></div>
    <label>Seed <input id="seed" placeholder="random" inputmode="numeric"></label>
    <label class="inline"><input type="checkbox" id="bloodlines" checked> Bloodlines</label>
    <div class="dlg-actions">
      <button value="cancel" class="btn ghost">Cancel</button>
      <button value="ok" class="btn" id="startBtn">Start</button>
    </div>
  </form>
</dialog>

<script src="/static/app.js"></script>
</body>
</html>
